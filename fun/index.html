!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhikhari</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:2rem;
}

.btn{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#28a745;
    color:white;
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
}

.success{
    display:none;
}

.success h2{
    color:white;
    font-size:3rem;
}

.success p{
    color:white;
    font-size:1.5rem;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container" id="proposal">
    <h1>500 phonepe karega kya please 🙏🙏 ? </h1>

    <button id="yes" class="btn">Yes 😊</button>
    <button id="no" class="btn">No 😢</button>
</div>

<div class="success" id="success">
    <h2>🎉 Thank You ! Tu bhai ha mera 🎉</h2>
    <p>Bas kabhi mangna matt ❤️🥰</p>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const proposal = document.getElementById("proposal");
const success = document.getElementById("success");

// No button move
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 100);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Mobile
noBtn.addEventListener("click", () => {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 100);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Yes button
yesBtn.addEventListener("click", () => {
    proposal.style.display = "none";
    success.style.display = "block";
});
</script>

</body>
</html>
